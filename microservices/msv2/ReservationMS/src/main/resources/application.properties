spring.application.name=ReservationMS

server.port=8086
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.client.service-url.defaultZone=eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.config.enabled=false
#http://localhost:8084/h2

# The name of the H2 database :
spring.datasource.url=jdbc:h2:mem:testdb
# The H2 Driver :
spring.datasource.driverClassName=org.h2.Driver
spring.data.jpa.repositories.bootstrap-mode=default
spring.datasource.username=sa
spring.datasource.password=

# automatic creation and modification of tables
spring.jpa.hibernate.ddl-auto=update
# Activate the H2 console :
spring.h2.console.enabled=true
# For customizing the console URL
spring.h2.console.path=/h2

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/MsSecurity

spring.security.oauth2.client.registration.msreservation.client-id=ms-reservation
spring.security.oauth2.client.registration.msreservation.client-secret=change-me
spring.security.oauth2.client.registration.msreservation.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.msreservation.scope=openid

spring.security.oauth2.client.provider.msreservation.token-uri=http://localhost:8080/realms/MsSecurity/protocol/openid-connect/token